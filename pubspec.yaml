name: studymate
description: "StudyMate — a student companion app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Light.ttf
          weight: 300
        - asset: assets/fonts/Kalam-Regular.ttf
          weight: 400
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
